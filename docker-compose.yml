# log_system —— Docker 开发 / 运行环境编排（基础定义）
# 数据层 + 应用层 + 采集层 全在容器内（开发联调，无生产数据）
# 开发覆盖（bind mount / 热更 / 端口映射）见 compose.override.yml，运行 `docker compose up` 自动叠加
# 技术路线：docs/tech-stack-selection.md v1.5（采集层 = Fluent Bit；agent-service 管控面纳入一阶段）

name: log_system

# 统一时区：所有容器时钟对齐本机（东八区 / Asia/Shanghai）。
# 注意：OpenSearch 写入时仍会把日期归一化为 UTC 存储，故面板显示还需在
# opensearch-dashboards.yml 中设 dateFormat:tz 覆盖（见该文件），二者配合才能与本地时间完全一致。
x-timezone: &tz
  TZ: Asia/Shanghai

services:
  # ===================== 数据 / 中间件层 =====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *tz
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 平台自身 PG 即"数据库日志"的真实来源，不再另起 pg 模拟容器。
    # logging_collector 把 stderr 接管进文件（相对 data_directory，postgres 用户天然可写）；
    # 代价是 docker logs postgres 只剩启动期输出，日志以文件为准。
    # log_min_duration_statement=200ms：只记慢查询，绝不能用 0（否则每条查询都落盘，
    # 叠加"日志→Kafka→Flink→CH"会形成自噬放大）。
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=pg_log
      - -c
      - log_filename=postgresql-%Y%m%d_%H%M%S.log
      - -c
      - log_min_duration_statement=200
      - -c
      # 必须加引号：YAML 的 plain scalar 会削掉尾随空格，导致 prefix 变成
      # "%u@%d" —— 日志里用户名和级别会粘成 "loguser@logdbLOG:"，解析器难切分
      - "log_line_prefix=%m [%p] %u@%d "
      # 日志时间跟随容器 TZ 输出 CST：默认是 UTC，而解析器按本地时区解释，
      # 不设这个会让所有 PG 日志时间整体偏 8 小时（且日期跨界时错到前一天）
      - -c
      - log_timezone=Asia/Shanghai
      - -c
      - log_rotation_size=10MB
      # 滚动出**新文件**而不是截断旧文件：tail 遇到文件变小会重新从头读，造成重复采集
      - -c
      - log_truncate_on_rotation=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [log_net]

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    # ⚠️ Apple Silicon 若拉取报架构错误：
    #   方案A 加 `platform: linux/amd64`（模拟，较慢）；方案B 改用 arm64 兼容 tag。
    # 开发期安全插件已关闭（DISABLE_SECURITY_PLUGIN=true）。
    restart: unless-stopped
    environment:
      <<: *tz
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: -1
      nofile: 65536
    volumes:
      - osdata:/usr/share/opensearch/data
    networks: [log_net]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    restart: unless-stopped
    environment:
      <<: *tz
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on: [opensearch]
    networks: [log_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      <<: *tz
    # 落 /data 而不是共享卷 ruilog_logs：redis 进程以 redis 用户(非 root)运行，
    # 命名卷挂载到镜像内已有目录 /data 时会继承其属主(redis)，可直接写；
    # 挂到空的共享卷根目录则是 root:root，会直接 "Can't open the log file: Permission denied"。
    # save 60 1：60 秒内有 1 次写入就落 RDB —— 缓存本来就有登录态写入，这样 BGSAVE
    # 的 started/terminated 会持续产出真实日志；关闭持久化（save ""）则 redis 空闲时
    # 一条日志都不写，"中间件日志在采"从数据上看不出来。
    command: ["redis-server", "--logfile", "/data/redis.log", "--save", "60 1"]
    volumes:
      - redisdata:/data
    networks: [log_net]

  # ---- ClickHouse：双引擎的聚合引擎（与 OpenSearch 分工：OS 明细全文 / CH 聚合） ----
  # 对标云智慧 DOLA：列式存储承担总览/仪表盘/直方图/P95 等重聚合。
  # 初始化 SQL 挂载到 docker-entrypoint-initdb.d，首次启动自动建库/表/物化视图。
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    environment:
      <<: *tz
      CLICKHOUSE_DB: ruilog
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ruilog}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ruilogpass}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    networks: [log_net]

  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      <<: *tz
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafkadata:/bitnami/kafka
      # broker 主日志落 /bitnami/kafka/server.log（见 tools/kafka/log4j.properties），
      # 由 Fluent Bit 只读挂载同一数据卷采集，不额外起模拟容器
      - ./tools/kafka/log4j.properties:/opt/bitnami/kafka/config/log4j.properties:ro
    networks: [log_net]

  # ---- 一次性：修正 checkpoint 卷属主为 flink 用户（否则 JM 无法建 checkpoint 目录）----
  flink-init:
    image: flink:1.18-scala_2.12
    restart: "no"
    entrypoint: ["sh", "-c", "mkdir -p /flink-checkpoints /flink-savepoints && chown -R flink:flink /flink-checkpoints /flink-savepoints"]
    volumes:
      - flinkckpt:/flink-checkpoints
      - flinksp:/flink-savepoints
    networks: [log_net]

  # ---- 一次性 topic 初始化：幂等创建 ruilog.logs.raw / ruilog.logs.dlq ----
  kafka-init:
    image: bitnami/kafka:3.7
    restart: "no"
    environment:
      <<: *tz
      KAFKA_BROKER: kafka:9092
    entrypoint: ["/bin/bash", "/init/init-topics.sh"]
    volumes:
      - ./scripts/kafka:/init:ro
    depends_on: [kafka]
    networks: [log_net]

  # ---- 一次性：索引模板 + ISM 生命周期策略，必须先于任何写入服务 ----
  # 没有它，新建索引会走动态 mapping，现场字段一多就撞 total_fields.limit 断流；
  # 且过期日志没有任何自动清理，50GB/天跑两个月就写满磁盘。
  opensearch-init:
    image: opensearchproject/opensearch:3.9.0
    restart: "no"
    environment:
      <<: *tz
      OPENSEARCH_URL: http://opensearch:9200
      RUILOG_HOME: /opt/ruilog
      OPENSEARCH_SHARDS: ${OPENSEARCH_SHARDS:-1}
      OPENSEARCH_REPLICAS: ${OPENSEARCH_REPLICAS:-0}
    entrypoint: ["sh", "/init/apply-logs-template.sh"]
    volumes:
      - ./scripts/opensearch:/init:ro
      - ./opensearch:/opt/ruilog/opensearch:ro
    depends_on: [opensearch]
    networks: [log_net]

  flink-jobmanager:
    # 自定义镜像：官方 flink:1.18 + Kafka connector（lib/ 下 jar）
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    image: log_system-flink:1.18
    command: jobmanager
    depends_on:
      flink-init:
        condition: service_completed_successfully
    environment:
      <<: *tz
      # checkpoint 开箱即用：Job 内另按代码设置 interval/exactly-once；
      # 此处声明 FileSystem 状态后端的基础目录（挂载卷，重启不丢状态）。
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: filesystem
        state.checkpoints.dir: file:///flink-checkpoints
        state.savepoints.dir: file:///flink-savepoints
        execution.checkpointing.interval: 10s
        # 商用高可用：TM/JM 故障自动重启并从最近 checkpoint 恢复，不丢数据、无需人工重提
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 5s
        jobmanager.execution.failover-strategy: region
    volumes:
      - flinkckpt:/flink-checkpoints
      - flinksp:/flink-savepoints
      # Job fat jar（阶段3构建产物）挂载到 JM，供 flink run 提交
      - ./flink-jobs/java/target:/opt/flink/jobs:ro
    networks: [log_net]

  flink-taskmanager:
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    image: log_system-flink:1.18
    command: taskmanager
    depends_on:
      flink-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
    environment:
      <<: *tz
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: filesystem
        state.checkpoints.dir: file:///flink-checkpoints
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - flinkckpt:/flink-checkpoints
      - flinksp:/flink-savepoints
    networks: [log_net]

  # ===================== 应用层（FastAPI 微服务） =====================
  # 统一后端 FastAPI(Python)，镜像统一由根 Dockerfile 构建；
  # 开发期源码 bind mount + uvicorn --reload（见 compose.override.yml）
  web:
    image: nginx:1.27-alpine
    environment:
      <<: *tz
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 官方镜像把 access.log/error.log 软链到 stdout，容器内拿不到文件；
      # nginx.conf 里已显式指定 access_log/error_log 到该目录（真文件、真格式）。
      - ruilog_logs:/var/log/ruilog
    depends_on:
      - auth-service
      - search-service
      - dashboard-service
      - alarm-service
      - ingest-service
      - agent-service
      - system-service
      - ai-service
    networks: [log_net]

  auth-service:
    image: log_system-backend
    working_dir: /app/services/auth-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on: [postgres, redis]
    networks: [log_net]

  search-service:
    image: log_system-backend
    working_dir: /app/services/search-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on: [opensearch, postgres, redis]
    networks: [log_net]

  dashboard-service:
    image: log_system-backend
    working_dir: /app/services/dashboard-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on: [opensearch, postgres]
    networks: [log_net]

  alarm-service:
    image: log_system-backend
    working_dir: /app/services/alarm-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on: [postgres, opensearch, kafka]
    networks: [log_net]

  ingest-service:
    image: log_system-backend
    working_dir: /app/services/ingest-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    # init 容器必须真正跑完：否则首条日志写入时模板还没生效，
    # 索引会退化成动态 mapping，且 ISM 没挂上，过期数据无法自动清理。
    depends_on:
      postgres: { condition: service_started }
      kafka: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
      opensearch-init: { condition: service_completed_successfully }
    networks: [log_net]

  agent-service:
    image: log_system-backend
    working_dir: /app/services/agent-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on: [postgres, redis]
    networks: [log_net]

  system-service:
    image: log_system-backend
    working_dir: /app/services/system-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on:
      postgres: { condition: service_started }
      opensearch-init: { condition: service_completed_successfully }
    networks: [log_net]

  ai-service:
    image: log_system-backend
    working_dir: /app/services/ai-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *tz
    env_file: .env
    depends_on: [postgres, ingest-service]
    networks: [log_net]

  # ===================== 采集层（Fluent Bit，模拟业务主机 agent） =====================
  # 业务主机只部署单一 Fluent Bit 进程；管控脚本随包部署、由 exec 插件调起（不另起进程）
  # 见 docs/tech-stack-selection.md 3.2(8) / 9.1
  fluentbit:
    image: log_system-fluentbit
    environment:
      <<: *tz
      # 采集器凭证：采集端凭它向 ingest-service 数据面上报；租户按来源注入，
      # 一个采集器可跨多租户（与"应用 API Key 绑定单租户"区分）。
      COLLECTOR_KEY: "${INGEST_COLLECTOR_KEY:-dev-collector-key}"
    depends_on: [opensearch, kafka, agent-service, ingest-service]
    volumes:
      # 开发期与 log-generator 共享命名卷 app_logs，tail 采集其输出的多租户日志
      - app_logs:/var/log/app:ro
      # 平台自身组件日志（nginx / redis / syslog）统一落这个卷
      - ruilog_logs:/var/log/ruilog:ro
      # postgres 的 logging_collector 输出在数据目录内的 pg_log 子目录；
      # 只读挂载整卷、Path 精确到 *.log，不碰 WAL 等其他文件。
      - pgdata:/var/lib/pgdata:ro
      # kafka 的 log4j 文件日志（与 broker 数据同卷）
      - kafkadata:/var/lib/kafkadata:ro
      # redis 的 --logfile 输出（与其 /data 同卷）
      - redisdata:/var/lib/redisdata:ro
      # 采集断点持久化：重启/升级后不重复采集历史文件
      - fluentbit_db:/fluent-bit/db
    networks: [log_net]

  # ===================== 测试业务系统模拟器（log-generator） =====================
  # 无真实业务，持续输出 [LEVEL] <msg> tenant=<id> 日志到共享卷 app_logs，
  # 由 fluentbit 的 tail 输入采集，构成完整"业务系统→采集→多租户索引"链路。
  # 见 docs/tech-stack-selection.md 9.x 测试 harness。
  log-generator:
    image: log_system-log-generator
    environment:
      <<: *tz
      TENANTS: "default,acme,gp"
      LOG_INTERVAL: "1.0"
      ERROR_RATE: "0.2"
      WARN_RATE: "0.25"
      # 按租户分文件写（<tenant>.log），正文不再带 tenant 字段：
      # 租户归属由采集端按"来源文件"注入，模拟真实系统日志无租户字段的形态。
      LOG_DIR: /var/log/app
      # 一小部分日志模拟"归属不明"的系统，用于验证 logs-unknown 治理通道
      UNASSIGNED_RATE: "0.05"
    volumes:
      - app_logs:/var/log/app
    depends_on: [fluentbit]
    networks: [log_net]

  # ===================== 系统日志源（唯一保留的模拟容器） =====================
  # 为什么只剩它：容器共享宿主内核，读不到宿主机的 syslog/journald，kernel/auth/cron
  # 这类真实系统事件无法从任何业务容器"顺带"获得。alpine + busybox syslogd
  # 常驻内存约 1MB、无额外磁盘占用，是验证 system 类采集的最小代价。
  #
  # 其余三类改为采**平台自身组件**（真实进程、真实格式，不再另起模拟容器）：
  #   middleware ← web(nginx access/error) / redis / kafka
  #   database   ← postgres
  #   business   ← log-generator
  sys-sim:
    image: alpine:3.20
    restart: unless-stopped
    hostname: sys-sim
    environment:
      <<: *tz
    # sys-sim.sh 内部自带 mkdir -p，且日志直接写卷根目录（/var/log/ruilog/syslog）
    command: ["sh", "/sim/sys-sim.sh"]
    volumes:
      - ruilog_logs:/var/log/ruilog
      - ./tools/log-sim:/sim:ro
    networks: [log_net]

volumes:
  fluentbit_db:
  pgdata:
  osdata:
  kafkadata:
  chdata:
  flinkckpt:
  flinksp:
  app_logs:
  # 平台自身组件日志（nginx / syslog）共用卷：
  # 采集端只读挂载同一卷，避免为每个组件单独建卷。
  # redis / postgres / kafka 不在此列——它们写各自数据卷内的日志（属主与运行用户一致，
  # 否则非 root 进程无法在 root 属主的共享卷里建文件）。
  ruilog_logs:
  redisdata:

networks:
  log_net:
    driver: bridge
