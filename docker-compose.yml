# log_system —— Docker 开发 / 运行环境编排（基础定义）
# 数据层 + 应用层 + 采集层 全在容器内（开发联调，无生产数据）
# 开发覆盖（bind mount / 热更 / 端口映射）见 compose.override.yml，运行 `docker compose up` 自动叠加
# 技术路线：docs/tech-stack-mapping.md v1.5（采集层 = Fluent Bit；agent-service 管控面纳入一阶段）

name: log_system

services:
  # ===================== 数据 / 中间件层 =====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [log_net]

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    # ⚠️ Apple Silicon 若拉取报架构错误：
    #   方案A 加 `platform: linux/amd64`（模拟，较慢）；方案B 改用 arm64 兼容 tag。
    # 开发期安全插件已关闭（DISABLE_SECURITY_PLUGIN=true）。
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: -1
      nofile: 65536
    volumes:
      - osdata:/usr/share/opensearch/data
    networks: [log_net]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS: "true"
    depends_on: [opensearch]
    networks: [log_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [log_net]

  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafkadata:/bitnami/kafka
    networks: [log_net]

  flink-jobmanager:
    image: flink:1.18-scala_2.12
    # 本地已拉取 arm64 原生镜像，Apple Silicon 上原生运行（无需 linux/amd64 模拟/重新拉取）
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    networks: [log_net]

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    # 本地已拉取 arm64 原生镜像，Apple Silicon 上原生运行
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    networks: [log_net]

  # ===================== 应用层（FastAPI 微服务） =====================
  # 统一后端 FastAPI(Python)，镜像统一由根 Dockerfile 构建；
  # 开发期源码 bind mount + uvicorn --reload（见 compose.override.yml）
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - search-service
      - dashboard-service
      - alarm-service
      - ingest-service
      - agent-service
      - system-service
    networks: [log_net]

  auth-service:
    image: log_system-backend
    working_dir: /app/services/auth-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, redis]
    networks: [log_net]

  search-service:
    image: log_system-backend
    working_dir: /app/services/search-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [opensearch, postgres, redis]
    networks: [log_net]

  dashboard-service:
    image: log_system-backend
    working_dir: /app/services/dashboard-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [opensearch, postgres]
    networks: [log_net]

  alarm-service:
    image: log_system-backend
    working_dir: /app/services/alarm-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, opensearch, kafka]
    networks: [log_net]

  ingest-service:
    image: log_system-backend
    working_dir: /app/services/ingest-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, kafka]
    networks: [log_net]

  agent-service:
    image: log_system-backend
    working_dir: /app/services/agent-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, redis]
    networks: [log_net]

  system-service:
    image: log_system-backend
    working_dir: /app/services/system-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres]
    networks: [log_net]

  # ===================== 采集层（Fluent Bit，模拟业务主机 agent） =====================
  # 业务主机只部署单一 Fluent Bit 进程；管控脚本随包部署、由 exec 插件调起（不另起进程）
  # 见 docs/tech-stack-mapping.md 3.2(8) / 9.1
  fluentbit:
    image: log_system-fluentbit
    depends_on: [opensearch, kafka, agent-service]
    volumes:
      # 开发期与 log-generator 共享命名卷 app_logs，tail 采集其输出的多租户日志
      - app_logs:/var/log/app:ro
    networks: [log_net]

  # ===================== 测试业务系统模拟器（log-generator） =====================
  # 无真实业务，持续输出 [LEVEL] <msg> tenant=<id> 日志到共享卷 app_logs，
  # 由 fluentbit 的 tail 输入采集，构成完整"业务系统→采集→多租户索引"链路。
  # 见 docs/tech-stack-mapping.md 9.x 测试 harness。
  log-generator:
    image: log_system-log-generator
    environment:
      TENANTS: "default,acme,gp"
      LOG_INTERVAL: "1.0"
      ERROR_RATE: "0.2"
      WARN_RATE: "0.25"
      LOG_PATH: /var/log/app/app.log
    volumes:
      - app_logs:/var/log/app
    depends_on: [fluentbit]
    networks: [log_net]

volumes:
  pgdata:
  osdata:
  kafkadata:
  app_logs:

networks:
  log_net:
    driver: bridge
