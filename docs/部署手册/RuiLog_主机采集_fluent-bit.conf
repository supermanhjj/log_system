; ============================================================
; RuiLog 主机采集 Agent（Fluent Bit 5.2.x）
; 用法：环境变量 COLLECTOR_KEY/HOST_NAME/INGEST_HOST/INGEST_PORT/
;       APP_NAME/CLUSTER_ID 由 docker run 或 systemd EnvironmentFile 注入
; ============================================================
[SERVICE]
    Flush                     1
    Daemon                    off
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/ruilog/buffer/
    storage.sync              normal
    storage.max_chunks_up     128
    storage.total_limit_size  2G

[PARSER]
    Name        ruilog_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[PARSER]
    Name        ruilog_syslog
    Format      regex
    Time_Key    event_time
    Time_Format %b %d %H:%M:%S
    Time_Offset +0800
    Regex       ^(?<raw>(?<event_time>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<facility>[a-z0-9]+)\.(?<severity_name>[a-z]+)\s+(?<source>[^:]+):\s?(?<message>[\s\S]*))$

[PARSER]
    Name        ruilog_nginx_access
    Format      regex
    Time_Key    event_time
    Time_Format %d/%b/%Y:%H:%M:%S %z
    Regex       ^(?<raw>(?<remote_addr>\S+)\s+-\s+(?<remote_user>\S+)\s+\[(?<event_time>[^\]]+)\]\s+"(?<request>[^"]*)"\s+(?<status>\d{3})\s+(?<body_bytes>\S+)\s+"(?<referer>[^"]*)"\s+"(?<user_agent>[^"]*)")$

[PARSER]
    Name        ruilog_nginx_error
    Format      regex
    Time_Key    event_time
    Time_Format %Y/%m/%d %H:%M:%S
    Time_Offset +0800
    Regex       ^(?<raw>(?<event_time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})\s+\[(?<level>\w+)\]\s+(?<pid>\d+)#(?<tid>\d+):\s+\*?(?<conn_id>\d+)?\s*(?<message>[\s\S]*))$

; 业务 JSON：应用直接输出 JSON 一行一条
[INPUT]
    Name              tail
    Tag               ruilog.business.json
    Path              /var/log/app/*.json
    Parser            ruilog_json
    Path_Key          src_file
    Read_from_head    true
    DB                /var/lib/ruilog/business-json.db
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   8M
    Mem_Buf_Limit     32M
    Rotate_Wait       5
    Skip_Long_Lines   On

; 业务文本：非 JSON 的普通文本日志
[INPUT]
    Name              tail
    Tag               ruilog.business.text
    Path              /var/log/app/*.log
    Exclude_Path      /var/log/app/*.json
    Path_Key          src_file
    Read_from_head    true
    DB                /var/lib/ruilog/business-text.db
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   8M
    Mem_Buf_Limit     32M
    Rotate_Wait       5
    Skip_Long_Lines   On

; 系统日志：Ubuntu/Debian 用 syslog，RHEL/CentOS 改 messages
[INPUT]
    Name              tail
    Tag               ruilog.system.syslog
    Path              /var/log/syslog
    Parser            ruilog_syslog
    Path_Key          src_file
    Read_from_head    true
    DB                /var/lib/ruilog/system-syslog.db
    Buffer_Chunk_Size 128K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     20M
    Rotate_Wait       5

; nginx access
[INPUT]
    Name              tail
    Tag               ruilog.middleware.nginx_access
    Path              /var/log/nginx/access.log
    Parser            ruilog_nginx_access
    Path_Key          src_file
    Read_from_head    true
    DB                /var/lib/ruilog/nginx-access.db
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   8M
    Mem_Buf_Limit     16M
    Rotate_Wait       5

; nginx error
[INPUT]
    Name              tail
    Tag               ruilog.middleware.nginx_error
    Path              /var/log/nginx/error.log
    Parser            ruilog_nginx_error
    Path_Key          src_file
    Read_from_head    true
    DB                /var/lib/ruilog/nginx-error.db
    Buffer_Chunk_Size 128K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     16M
    Rotate_Wait       5

; 可选：接收网络设备/旧系统 syslog（Docker 需 -p 5140:5140/udp）
[INPUT]
    Name              syslog
    Tag               ruilog.system.remote
    Mode              unix_udp
    Listen            0.0.0.0
    Port              5140
    Parser            ruilog_syslog

[FILTER]
    Name    record_modifier
    Match   ruilog.business.*
    Record  log_class   business
    Record  source_type app
    Record  app         ${APP_NAME}
    Record  host        ${HOST_NAME}
    Record  cluster_id  ${CLUSTER_ID}

[FILTER]
    Name    record_modifier
    Match   ruilog.system.*
    Record  log_class   system
    Record  source_type syslog
    Record  app         linux
    Record  cluster_id  ${CLUSTER_ID}

[FILTER]
    Name    record_modifier
    Match   ruilog.middleware.nginx_access
    Record  log_class   middleware
    Record  source_type nginx-access
    Record  app         nginx
    Record  host        ${HOST_NAME}
    Record  cluster_id  ${CLUSTER_ID}

[FILTER]
    Name    record_modifier
    Match   ruilog.middleware.nginx_error
    Record  log_class   middleware
    Record  source_type nginx-error
    Record  app         nginx
    Record  host        ${HOST_NAME}
    Record  cluster_id  ${CLUSTER_ID}

[OUTPUT]
    Name              http
    Match             ruilog.*
    Host              ${INGEST_HOST}
    Port              ${INGEST_PORT}
    URI               /ingest/collector
    Format            json
    Header            Content-Type application/json
    Header            X-Collector-Key ${COLLECTOR_KEY}
    Retry_Limit       False
