# =============================================================================
# 中间件日志（nginx / redis / kafka）
#
# 采集对象全部是**日志平台自身**在跑的真实组件，不再另起模拟容器：
#   web      —— 前端/API 网关的 nginx（access 里有真实接口调用与状态码）
#   redis    —— 平台缓存/会话
#   kafka    —— 日志主干 broker（server.log）
#
# 与系统日志的关键差异：不同组件格式完全不同，必须一文件一解析器；
# 且组件级信息（app=nginx）采集器是确定的，直接静态打标，不留给网关猜。
# host 也用静态值：容器 hostname 是随机 ID，靠它查 hosts 台账不可靠。
# =============================================================================

# ---- nginx access（combined 格式，来自 web 容器）----
[INPUT]
    Name            tail
    Tag             ruilog.middleware.nginx-access
    Path            /var/log/ruilog/nginx-access.log
    Parser          nginx_access
    Path_Key        src_file
    Read_from_head  On
    DB              /fluent-bit/db/tail-nginx-access.db
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     20M

[FILTER]
    Name    modify
    Match   ruilog.middleware.nginx-access
    Add     log_class   middleware
    Add     source_type nginx-access
    Add     app         nginx
    Add     host        web

# ---- nginx error ----
[INPUT]
    Name            tail
    Tag             ruilog.middleware.nginx-error
    Path            /var/log/ruilog/nginx-error.log
    Parser          nginx_error
    Path_Key        src_file
    Read_from_head  On
    DB              /fluent-bit/db/tail-nginx-error.db
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     10M

[FILTER]
    Name    modify
    Match   ruilog.middleware.nginx-error
    Add     log_class   middleware
    Add     source_type nginx-error
    Add     app         nginx
    Add     host        web

# ---- redis（平台实例，--logfile 落盘到 /data/redis.log）----
[INPUT]
    Name            tail
    Tag             ruilog.middleware.redis
    Path            /var/lib/redisdata/redis.log
    Parser          redis_log
    Path_Key        src_file
    Read_from_head  On
    DB              /fluent-bit/db/tail-redis.db
    Buffer_Chunk_Size 128K
    Buffer_Max_Size   2M
    Mem_Buf_Limit     10M

[FILTER]
    Name    modify
    Match   ruilog.middleware.redis
    Add     log_class   middleware
    Add     source_type redis
    Add     app         redis
    Add     host        redis

# ---- kafka（broker 主日志，log4j 滚动文件）----
# 日志来自容器内 /bitnami/kafka/server.log，经数据卷只读挂载采集。
# 时间戳是本地时区无标记（TZ=Asia/Shanghai），解析器按本地时间处理。
[INPUT]
    Name            tail
    Tag             ruilog.middleware.kafka
    Path            /var/lib/kafkadata/server.log
    # 启动期会将整份配置 dump 成数百行制表符缩进文本，必须先合并成一条再解析，
    # 否则检索页会被"无时间戳、无级别"的配置行刷屏
    Multiline.parser kafka_log
    Path_Key        src_file
    Read_from_head  On
    DB              /fluent-bit/db/tail-kafka.db
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     20M
    # log4j 按 10MB 滚动，Rotate_Wait 保证滚动窗口内新文件按 mtime 接上，避免漏采
    Rotate_Wait     5

[FILTER]
    Name    parser
    Match   ruilog.middleware.kafka
    Key_Name log
    Parser   kafka_log4j

[FILTER]
    Name    modify
    Match   ruilog.middleware.kafka
    Add     log_class   middleware
    Add     source_type kafka
    Add     app         kafka
    Add     host        kafka

