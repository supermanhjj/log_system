# ---- 采集器自监控：心跳 ----
# distroless 版 fluent-bit 5.2.0 未编译 exec 输入插件（仅含 exec_wasi），
# 故无法以 sh 调起 scripts/control.sh。改用原生 dummy 输入 + http 输出，
# 等效实现"业务主机侧 Fluent Bit 定时上报 agent-service"的语义。
[INPUT]
    Name         dummy
    Tag          agent.heartbeat
    Dummy        {"hostname":"fluentbit","version":"1.0.0","status":"online","ts":"2026-01-01T00:00:00Z"}
    Interval_Sec 30

[OUTPUT]
    Name         http
    Match        agent.heartbeat
    Host         agent-service
    Port         8000
    URI          /heartbeat
    Format       json
    Header       Content-Type application/json

# 心跳结果回采（stdout，便于在容器日志中观察）
[OUTPUT]
    Name         stdout
    Match        agent.heartbeat
