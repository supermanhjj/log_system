# =============================================================================
# 数据库日志（PostgreSQL 为主，MySQL 按需启用）
#
# 采集对象：**日志平台自身的 PostgreSQL**（告警规则、用户、租户台账都在这）。
# 已开启 logging_collector，输出在数据目录的 pg_log 子目录（相对 data_directory，
# postgres 用户天然可写，不需要额外的卷权限处理）。
#
# 与系统/中间件日志最大的不同：**一条逻辑事件占多行**。
#   - PostgreSQL 长语句/错误上下文会换行（续行以制表符缩进）
# 所以先用 MULTILINE_PARSER 合并成一条（落在 log 字段），再用 parser 过滤器
# 从合并后的文本里抽字段——顺序不能颠倒，否则每条断行都会被当成独立日志。
#
# 阈值：log_min_duration_statement=200ms，只记慢查询与错误。
# 绝不能设 0 —— 那会把每条查询都落盘，再经 Kafka→Flink→CH 形成自噬放大。
# =============================================================================

# ---- PostgreSQL ----
[INPUT]
    Name              tail
    Tag               ruilog.database.postgres
    # %Y%m%d_%H%M%S 滚动：每次超 10MB 新建文件而不是截断，tail 不会重复读
    Path              /var/lib/pgdata/pg_log/*.log
    Multiline.parser  pg_stmt
    Path_Key          src_file
    Read_from_head    On
    DB                /fluent-bit/db/tail-postgres.db
    Buffer_Chunk_Size 128K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     20M

[FILTER]
    Name    parser
    Match   ruilog.database.postgres
    Key_Name log
    Parser   pg_log

[FILTER]
    Name    modify
    Match   ruilog.database.postgres
    Add     log_class   database
    Add     source_type postgres
    Add     app         postgresql
    Add     host        postgres

# -----------------------------------------------------------------------------
# MySQL（本地开发暂不部署：MySQL 容器常驻内存约 370MB，而平台自身没有 MySQL）。
# 解析器与多行规则仍保留在 parsers.conf 中，接入真实 MySQL 时取消注释即可：
#
# # ---- MySQL 错误日志 ----
# [INPUT]
#     Name            tail
#     Tag             ruilog.database.mysql-error
#     Path            /var/log/mysql/error.log
#     Parser          mysql_error
#     Path_Key        src_file
#     DB              /fluent-bit/db/tail-mysql-error.db
# [FILTER]
#     Name    modify
#     Match   ruilog.database.mysql-error
#     Add     log_class database
#     Add     source_type mysql-error
#     Add     app     mysql
#     Add     host    mysql-01
#
# # ---- MySQL 慢查询日志（多行块，块首只能放 start_state）----
# [INPUT]
#     Name              tail
#     Tag               ruilog.database.mysql-slow
#     Path              /var/log/mysql/slow.log
#     Multiline.parser  mysql_slow
#     Path_Key          src_file
#     DB                /fluent-bit/db/tail-mysql-slow.db
# [FILTER]
#     Name    parser
#     Match   ruilog.database.mysql-slow
#     Key_Name log
#     Parser   mysql_slow_decode
# [FILTER]
#     Name    modify
#     Match   ruilog.database.mysql-slow
#     Add     log_class database
#     Add     source_type mysql-slow
#     Add     app     mysql
#     Add     host    mysql-01
#
# 生产环境补充：
#   Oracle alert log：$ORACLE_BASE/diag/rdbms/<db>/<inst>/trace/alert_<inst>.log
#   SQL Server errorlog：ERRORLOG 文件，按行解析，需单独的 mssql_error 解析器
# -----------------------------------------------------------------------------
