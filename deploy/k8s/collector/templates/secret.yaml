{{- if not .Values.collector.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-key" (include "ruilog-collector.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "ruilog-collector.fullname" . }}
type: Opaque
stringData:
  {{ .Values.collector.secretKey }}: {{ required "必须提供 collector.collectorKey 或 collector.existingSecret" .Values.collector.collectorKey | quote }}
{{- end }}
