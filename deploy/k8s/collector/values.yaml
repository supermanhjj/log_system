# =============================================================================
# RuiLog 采集器 Helm 配置
#
# 职责边界：采集器只做「分帧 + 搬运原文 + 附加来源元数据」。
#   字段抽取、级别归一、分类、脱敏全部在服务端解析管线完成，
#   所以这里的 inputs 只声明「采哪些 namespace」和「用哪种多行分帧」。
#
# 新增一个业务系统 = 在 inputs 里加三行 + helm upgrade，不碰服务端规则。
# =============================================================================

image:
  repository: fluent/fluent-bit
  # 必须用 5.2：configmap 的多行过滤是 Multiline_Parser（5.x 语法），
  # 2.x 只认 multiline.parser，版本不匹配会导致 cri parser 未注册、filter 初始化失败。
  # 默认 5.2.0 是多架构标签，云上 amd64/arm64 都能拉；
  # Apple Silicon 本地如果拉到 amd64 报 exec format error，叠加 values-local.yaml 指定 arm64。
  tag: "5.2.0"
  pullPolicy: IfNotPresent

collector:
  clusterId: sgcc-test           # 多集群区分，写入 attrs.cluster_id
  # 平台与采集器同在 K8s（本地 Docker Desktop 与现场都是），走集群内服务名。
  # 只有采集器部署在集群外（主机 Agent）时才改成平台对外入口。
  ingestUrl: http://ingest-service:8000/ingest/collector
  ingestPort: 8000
  # 二选一：existingSecret（推荐）或下面的 collectorKey（调试用，会明文进 Secret）
  existingSecret: ""
  secretKey: collector-key
  collectorKey: "dev-collector-key"
  memBufLimit: 64MB

# 采集器自身作为「Agent」向平台上报心跳，Agent 管理页才能看到在跑的采集端。
# 台账归属租户：K8s 采集器是集群级组件，这里填它主要服务的业务系统；
# 真正的日志归属仍由服务端按 namespace→tenant 映射判定，与此无关。
agent:
  enabled: true
  service: agent-service
  port: 8000
  uri: /heartbeat
  tenant: i6000
  intervalSec: 30

# 每条 INPUT 可精确到 container（同一 namespace 内不同服务分帧规则不同时必填）。
# multiline 可选：ruilog-java / ruilog-go / ruilog-python / none。
# 名字必须带 ruilog- 前缀：java / go / python 是 Fluent Bit 内置多行 parser 名，
# 重名时内置规则生效，异常栈会与 ERROR 表头拆成两条（实测踩坑）。
# 异常栈必须分帧，否则一个 SQL 异常会变成 20 条级别为 UNKNOWN 的裸行，比不采还干扰判断。
# 租户归属由服务端从 src_file 的 namespace 段判定，不在这里注入 tenant_id。
inputs:
  - name: i6000-order
    namespace: i6000
    container: order
    multiline: ruilog-java
    labels:
      log_class: business
      source_type: app
      # 容器日志正文没有主机字段：host 取采集器所在节点（DaemonSet 注入
      # NODE_NAME，配置里以 ${NODE_NAME} 引用）。系统日志不设此项——
      # 它自带真实主机名（i6000-node-01），比节点名更精确。
      host: ${NODE_NAME}
  - name: i6000-sys
    namespace: i6000
    container: sys
    multiline: none
    labels:
      log_class: system
      source_type: syslog

# 不排除自身，采集器会采自己的日志，形成自我放大
excludeNamespaces:
  - kube-system
  - ruilog-system
  - monitoring

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 1000m, memory: 512Mi }

# 挂宿主机整个 /var/log：/var/log/containers 是软链，只挂它会看到断链
hostLogPath: /var/log
# DB 与 buffer 直接放挂载根，避免子目录不存在导致位点写入失败
dbPath: /var/lib/ruilog

nodeSelector: {}
tolerations:
  - operator: Exists          # 不写这条 master 节点采不到
affinity: {}
