# K8s 网关配置：静态反代 + SPA 托管。
# 与 compose 版的差异：服务名指向 K8s Service，proxy_pass 不再使用变量形式
# （ClusterIP 稳定，无需运行期 DNS 解析）；日志走容器 stdout，由采集器统一收集。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://auth-service:8000;
    }
    location /api/search/ {
        rewrite ^/api/search/(.*)$ /$1 break;
        proxy_pass http://search-service:8000;
    }
    location /api/dashboards/ {
        rewrite ^/api/dashboards/(.*)$ /$1 break;
        proxy_pass http://dashboard-service:8000;
    }
    location /api/alarms/ {
        rewrite ^/api/alarms/(.*)$ /$1 break;
        proxy_pass http://alarm-service:8000;
    }
    location /api/data/ {
        rewrite ^/api/data/(.*)$ /$1 break;
        proxy_pass http://ingest-service:8000;
    }
    location /api/pipelines/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ingest-service:8000;
    }
    location /api/agents/ {
        rewrite ^/api/agents/(.*)$ /$1 break;
        proxy_pass http://agent-service:8000;
    }
    location /api/system/ {
        rewrite ^/api/system/(.*)$ /$1 break;
        proxy_pass http://system-service:8000;
    }
    location /api/ai/ {
        rewrite ^/api/ai/(.*)$ /$1 break;
        proxy_pass http://ai-service:8000;
    }
}
