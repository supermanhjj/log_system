# K8s 网关配置模板（不是最终配置，运行时才渲染）。
#
# 渲染方式：web Pod 的 initContainer `render-nginx-conf` 把本文件里的
#   __RESOLVER__   → 集群 DNS 地址
#   __NAMESPACE__  → 当前命名空间（downward API 注入）
# 替换后写进 /etc/nginx/conf.d/default.conf，再 nginx -t 校验通过才起主容器。
# 因此本文件里不允许出现任何写死的 IP / 集群名 / 命名空间。
#
# __RESOLVER__ 的取值优先级：
#   1) ruilog-env 里的 NGINX_RESOLVER（需要固定 DNS 时显式配置，例如 k3s 的 10.43.0.10）
#   2) 留空时自动读 Pod 的 /etc/resolv.conf 取第一个 nameserver（默认，适配任何集群）
#
# 为什么用 resolver + 变量式 proxy_pass，而不是静态 upstream：
#   nginx 在【加载配置时】就解析静态 upstream 的域名，一旦启动瞬间集群 DNS 没就绪
#   （Docker Desktop / 节点重启后常见）会 [emerg] host not found in upstream 直接退出。
#   变量式 proxy_pass 把解析推迟到【请求时】，DNS 抖动只影响单个请求，进程不退出。
#
# 另外两点：
#   * nginx 的 resolver 不走 /etc/resolv.conf 的 search 域，短名解析不到，
#     所以上游必须写全 FQDN（<svc>.<namespace>.svc.cluster.local）。
#   * 变量式 proxy_pass 不会自动替换 URI，所以每条都用 rewrite ... break，
#     先把 /api/<svc>/xxx 削成 /xxx，再原样透传。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver __RESOLVER__ valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        set $svc_auth auth-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$svc_auth;
    }
    location /api/search/ {
        set $svc_search search-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/search/(.*)$ /$1 break;
        proxy_pass http://$svc_search;
    }
    location /api/dashboards/ {
        set $svc_dashboard dashboard-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/dashboards/(.*)$ /$1 break;
        proxy_pass http://$svc_dashboard;
    }
    location /api/alarms/ {
        set $svc_alarm alarm-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/alarms/(.*)$ /$1 break;
        proxy_pass http://$svc_alarm;
    }
    location /api/data/ {
        set $svc_ingest ingest-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/data/(.*)$ /$1 break;
        proxy_pass http://$svc_ingest;
    }
    location /api/pipelines/ {
        set $svc_pipeline ingest-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$svc_pipeline;
    }
    location /api/agents/ {
        set $svc_agent agent-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/agents/(.*)$ /$1 break;
        proxy_pass http://$svc_agent;
    }
    location /api/system/ {
        set $svc_system system-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/system/(.*)$ /$1 break;
        proxy_pass http://$svc_system;
    }
    location /api/ai/ {
        set $svc_ai ai-service.__NAMESPACE__.svc.cluster.local:8000;
        rewrite ^/api/ai/(.*)$ /$1 break;
        proxy_pass http://$svc_ai;
    }

    # ---- 采集端协议（集群外主机直连，不带 /api 前缀）----
    # 接入包里的地址就是网关地址，这两条不放开，集群外主机心跳与上报都连不上。
    location = /heartbeat {
        set $svc_agent_hb agent-service.__NAMESPACE__.svc.cluster.local:8000;
        proxy_pass http://$svc_agent_hb;
    }
    location /ingest/ {
        set $svc_ingest_raw ingest-service.__NAMESPACE__.svc.cluster.local:8000;
        # 变量式 proxy_pass 不替换 URI，这里用 $request_uri 原样透传
        proxy_pass http://$svc_ingest_raw$request_uri;
    }
}
