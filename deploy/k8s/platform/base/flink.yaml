# Flink 单机集群（JM + TM）+ 作业提交 Job。
# 与 compose 版的差异：job jar 打进镜像，不再依赖宿主机 target 目录 bind mount。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-checkpoints
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
spec:
  selector: { app: flink-jobmanager }
  ports:
    - { name: rpc, port: 6123, targetPort: 6123 }
    - { name: blob, port: 6124, targetPort: 6124 }
    - { name: ui, port: 8081, targetPort: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
spec:
  replicas: 1
  selector: { matchLabels: { app: flink-jobmanager } }
  template:
    metadata: { labels: { app: flink-jobmanager } }
    spec:
      initContainers:
        - name: init-dirs
          image: log_system-flink:1.18
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c", "mkdir -p /flink-checkpoints/savepoints && chown -R flink:flink /flink-checkpoints"]
          volumeMounts: [{ name: ckpt, mountPath: /flink-checkpoints }]
      containers:
        - name: jobmanager
          image: log_system-flink:1.18
          # 官方镜像以 docker-entrypoint.sh 为入口，jobmanager/taskmanager 必须走 args
          args: ["jobmanager"]
          env:
            - { name: TZ, value: Asia/Shanghai }
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                state.backend: filesystem
                state.checkpoints.dir: file:///flink-checkpoints
                state.savepoints.dir: file:///flink-checkpoints/savepoints
                execution.checkpointing.interval: 10s
                restart-strategy: fixed-delay
                restart-strategy.fixed-delay.attempts: 10
                restart-strategy.fixed-delay.delay: 5s
                jobmanager.execution.failover-strategy: region
          ports: [{ containerPort: 6123 }, { containerPort: 8081 }]
          readinessProbe: { tcpSocket: { port: 6123 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: ckpt, mountPath: /flink-checkpoints }]
      volumes:
        - name: ckpt
          persistentVolumeClaim: { claimName: flink-checkpoints }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
spec:
  replicas: 1
  selector: { matchLabels: { app: flink-taskmanager } }
  template:
    metadata: { labels: { app: flink-taskmanager } }
    spec:
      initContainers:
        - name: init-dirs
          image: log_system-flink:1.18
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c", "mkdir -p /flink-checkpoints && chown -R flink:flink /flink-checkpoints"]
          volumeMounts: [{ name: ckpt, mountPath: /flink-checkpoints }]
      containers:
        - name: taskmanager
          image: log_system-flink:1.18
          args: ["taskmanager"]
          env:
            - { name: TZ, value: Asia/Shanghai }
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                state.backend: filesystem
                state.checkpoints.dir: file:///flink-checkpoints
                taskmanager.numberOfTaskSlots: 2
                taskmanager.memory.process.size: 1024m
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
          volumeMounts: [{ name: ckpt, mountPath: /flink-checkpoints }]
      volumes:
        - name: ckpt
          persistentVolumeClaim: { claimName: flink-checkpoints }
---
# 作业守护：常驻 supervisor 代替一次性 submit Job。
#
# 为什么不用 Job：K8s Job 一旦 Complete 就不会再跑。Docker Desktop / 节点重启后，
# JM 被拉起成一个空的 session 集群（无 HA 元数据，日志会写 "recovered 0 persisted
# job graphs"），没人重新提交作业，于是 Kafka 只积压、不落库，Web 端“今日”永远是空的。
#
# supervisor 每 30s（SUPERVISOR_CHECK_INTERVAL 可调）走一次 JM REST /jobs/overview：
# 有 RUNNING 作业就跳过；没有就把残留的非运行作业 cancel 掉再重新 flink run -d。作业本身 setStartingOffsets 用
# committedOffsets(EARLIEST) 续读、下游靠 event_id / ReplacingMergeTree 幂等，
# 重复提交不会丢数据也不会重复计数。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-job-supervisor
spec:
  replicas: 1
  selector: { matchLabels: { app: flink-job-supervisor } }
  template:
    metadata: { labels: { app: flink-job-supervisor } }
    spec:
      containers:
        - name: supervisor
          image: ruilog-flink-job:k8s
          envFrom:
            - configMapRef: { name: ruilog-env }
          env:
            # 探测间隔放 ConfigMap（optional）：base 默认 30s，overlay 可调 60s。
            # 显式 value 会盖掉 envFrom，所以这里必须用 valueFrom 才能让 CM 生效。
            - name: SUPERVISOR_CHECK_INTERVAL
              valueFrom:
                configMapKeyRef: { name: ruilog-env, key: SUPERVISOR_CHECK_INTERVAL, optional: true }
            - name: SUPERVISOR_RETRY_INTERVAL
              valueFrom:
                configMapKeyRef: { name: ruilog-env, key: SUPERVISOR_RETRY_INTERVAL, optional: true }
          command:
            - sh
            - -c
            - |
              set -u
              JM="${FLINK_JOBMANAGER:-flink-jobmanager:8081}"
              JAR=/opt/flink/jobs/log-pipeline.jar
              FLINK=/opt/flink/bin/flink
              # 探活用 REST，不要用 flink CLI：CLI 每次都是一次 JVM 冷启动，
              # 15s 一次的代价在低配单节点上是可见的 CPU 尖峰。
              # 注意 /jobs/overview 的字段是 state 不是 status。
              probe() {
                if command -v curl >/dev/null 2>&1; then
                  curl -sf -m 5 "http://$JM/jobs/overview" 2>/dev/null | grep -q '"state":"RUNNING"'
                else
                  $FLINK list -r -m "$JM" 2>/dev/null | grep -qE '[0-9a-f]{32}'
                fi
              }
              echo "[supervisor] watching $JM for $JAR"
              while true; do
                if probe; then
                  sleep "${SUPERVISOR_CHECK_INTERVAL:-30}"
                  continue
                fi
                # 双检：JM 刚起来、作业还在 CREATED→RUNNING 过渡时，别把它当成残留 cancel 掉
                sleep 5
                if probe; then
                  sleep "${SUPERVISOR_CHECK_INTERVAL:-30}"
                  continue
                fi
                ALL=$($FLINK list -m "$JM" 2>/dev/null | grep -oE '[0-9a-f]{32}' || true)
                for j in $ALL; do
                  echo "[supervisor] cancel non-running job $j"
                  $FLINK cancel -m "$JM" "$j" >/dev/null 2>&1 || true
                done
                echo "[supervisor] no RUNNING job, submitting..."
                # JM 还没就绪时这里会失败，下一轮自动重试
                $FLINK run -d -m "$JM" "$JAR" 2>&1 | tail -8 || true
                sleep "${SUPERVISOR_RETRY_INTERVAL:-20}"
              done
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
