apiVersion: apps/v1
kind: Deployment
metadata: { name: ingest-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: ingest-service } }
  template:
    metadata: { labels: { app: ingest-service } }
    spec:
      # 等 system-service 播完租户/namespace 映射再接收日志，避免首分钟日志因归属不明被拒收
      initContainers:
        - name: wait-tenant-map
          image: ruilog-backend:k8s
          envFrom: [{ configMapRef: { name: ruilog-env } }, { secretRef: { name: ruilog-secret } }]
          command:
            - python
            - -c
            - |
              import os, time, psycopg2
              for _ in range(120):
                  try:
                      c = psycopg2.connect(host=os.getenv("POSTGRES_HOST"), port=os.getenv("POSTGRES_PORT"),
                                           dbname=os.getenv("POSTGRES_DB"), user=os.getenv("POSTGRES_USER"),
                                           password=os.getenv("POSTGRES_PASSWORD"), connect_timeout=3)
                      cur = c.cursor(); cur.execute("SELECT 1 FROM namespace_tenant LIMIT 1"); cur.fetchall()
                      print("tenant map ready"); break
                  except Exception:
                      time.sleep(3)
              else:
                  raise SystemExit("tenant map timeout")
      containers:
        - name: ingest-service
          image: ruilog-backend:k8s
          workingDir: /app/services/ingest-service
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom: [{ configMapRef: { name: ruilog-env } }, { secretRef: { name: ruilog-secret } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 60, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: ingest-service }
spec:
  selector: { app: ingest-service }
  ports: [{ port: 8000, targetPort: 8000 }]
---
