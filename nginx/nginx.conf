# =============================================================================
# 本文件被挂载为 /etc/nginx/conf.d/default.conf，位于 http 上下文内。
#
# 日志落文件：nginx 官方镜像把 /var/log/nginx/{access,error}.log 软链到
# /dev/stdout、/dev/stderr，容器里拿不到可采集的文件。这里显式指到共享卷
# /var/log/ruilog（由 Fluent Bit 只读挂载采集）。
#   文件由 master(root) 打开后 fork 给 worker 继承 fd，worker 无需目录写权限。
#   buffer=32k flush=5s 把高频小写入合并，避免逐条 write 放大 I/O。
# =============================================================================
access_log /var/log/ruilog/nginx-access.log combined buffer=32k flush=5s;
error_log  /var/log/ruilog/nginx-error.log warn;

server {
    listen 80;
    server_name _;

    # 前端静态资源：Vue3 构建产物 ./frontend/dist（dev 与 prod 编排均只读挂载）
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS。nginx 对 proxy_pass 里的域名默认只在启动时解析一次并缓存到进程结束，
    # 后端容器重建换了 IP 后请求就会打到「错的服务」上（表现为串服务 / 404）。
    # 用 resolver + 变量形式 proxy_pass 让解析发生在运行期，valid=10s 保证 IP 变化后自动跟随。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 反代公共头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须不缓存：它引用带哈希的 assets 文件名，一旦被浏览器缓存住，
    # 发版后会继续加载旧包（表现为「代码已改、界面没变」，旧包还可能带已废弃的租户编码）。
    # 带哈希的 assets 则可以长缓存，文件名变了自然失效。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ---- 后端微服务反代（同 docker 网络，按前缀路由；剥离 /api/<svc> 前缀） ----
    # 注意：变量形式的 proxy_pass 不再自动做「location 前缀替换」，必须显式 rewrite；
    #       break 保证只重写一次，query string 会自动保留。
    location /api/auth/ {
        set $upstream http://auth-service:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/search/ {
        set $upstream http://search-service:8000;
        rewrite ^/api/search/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/dashboards/ {
        set $upstream http://dashboard-service:8000;
        rewrite ^/api/dashboards/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/alarms/ {
        set $upstream http://alarm-service:8000;
        rewrite ^/api/alarms/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/data/ {
        set $upstream http://ingest-service:8000;
        rewrite ^/api/data/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/pipelines/ {
        set $upstream http://ingest-service:8000;
        rewrite ^/api/pipelines/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/agents/ {
        set $upstream http://agent-service:8000;
        rewrite ^/api/agents/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/system/ {
        set $upstream http://system-service:8000;
        rewrite ^/api/system/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/ai/ {
        set $upstream http://ai-service:8000;
        rewrite ^/api/ai/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # 开发期：OpenSearch-Dashboards 便捷入口（含 WebSocket 升级）
    location /osd/ {
        set $osd_upstream http://opensearch-dashboards:5601;
        rewrite ^/osd/(.*)$ /$1 break;
        proxy_pass $osd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
