server {
    listen 80;
    server_name _;

    # 前端静态资源：Vue3 构建产物 ./frontend/dist（dev 与 prod 编排均只读挂载）
    root /usr/share/nginx/html;
    index index.html;

    # 反代公共头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端微服务反代（开发期同 docker 网络，按前缀路由；末尾 / 去掉前缀） ----
    location /api/auth/       { proxy_pass http://auth-service:8000/; }
    location /api/search/     { proxy_pass http://search-service:8000/; }
    location /api/dashboards/ { proxy_pass http://dashboard-service:8000/; }
    location /api/alarms/     { proxy_pass http://alarm-service:8000/; }
    location /api/data/       { proxy_pass http://ingest-service:8000/; }
    location /api/agents/     { proxy_pass http://agent-service:8000/; }
    location /api/system/     { proxy_pass http://system-service:8000/; }
    location /api/ai/         { proxy_pass http://ai-service:8000/; }

    # 开发期：OpenSearch-Dashboards 便捷入口（含 WebSocket 升级）
    location /osd/ {
        proxy_pass http://opensearch-dashboards:5601/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
