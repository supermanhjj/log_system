[PARSER]
    Name   json
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[PARSER]
    Name   app_log
    Format regex
    # 抽取 level / message / tenant_id；tenant_id 直接产出用于多租户索引隔离，
    # 故 fluent-bit.conf 不再需要 record_modifier 复制字段（record_modifier 仅支持字面量）。
    Regex  ^\[(?<level>[A-Z]+)\]\s(?<message>.*?)(?:\s+tenant=(?<tenant_id>[A-Za-z0-9_]+))?$
