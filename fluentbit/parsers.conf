[PARSER]
    Name   json
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[PARSER]
    Name   app_log
    Format regex
    # 抽取行首事件时间戳为 @timestamp（Time_Key=event_time），实现"日志自带时间戳"的真实语义，
    # 而非 Fluent Bit 采集时刻。时间格式 ISO8601 本地时区、偏移无冒号（%z 兼容，如 +0800）。
    # 其余字段：level / message / source / host / traceId / tenant_id / status。
    # 额外用 (?<raw>...) 把【整行原始日志】整体捕获为 raw 字段原样保留——
    # 真实业务日志五花八门，结构化字段未必兜得住，必须留一份原始整行用于详情/上下文回显。
    Time_Key   event_time
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Regex  ^(?<raw>\[(?<event_time>[^\]]+)\]\s\[(?<level>[A-Z]+)\]\s(?<message>.*?)\s+source=(?<source>[A-Za-z0-9_\-]+)\s+host=(?<host>[A-Za-z0-9_\-\.]+)\s+traceId=(?<traceId>[A-Za-z0-9]+)\s+tenant=(?<tenant_id>[A-Za-z0-9_]+)(?:\s+status=(?<status>\d+))?)$
