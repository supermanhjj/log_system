[PARSER]
    Name   json
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[PARSER]
    Name   app_log
    Format regex
    # 抽取行首事件时间戳为 @timestamp（Time_Key=event_time），实现"日志自带时间戳"的真实语义，
    # 而非 Fluent Bit 采集时刻。时间格式 ISO8601 本地时区、偏移无冒号（%z 兼容，如 +0800）。
    #
    # 重要：正则里**没有 tenant 字段**。租户归属由采集端按"来源"注入（哪个文件/通道），
    # 这与真实系统日志一致——操作系统、中间件、数据库日志本来就不含业务租户字段。
    # 其余字段：level / message / source / host / traceId / status。
    # 额外用 (?<raw>...) 把【整行原始日志】整体捕获为 raw 字段原样保留——真实日志五花八门，
    # 结构化字段未必兜得住，必须留一份原始整行用于详情/上下文回显。
    Time_Key   event_time
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Regex  ^(?<raw>\[(?<event_time>[^\]]+)\]\s\[(?<level>[A-Z]+)\]\s(?<message>.*?)\s+source=(?<source>[A-Za-z0-9_\-]+)\s+host=(?<host>[A-Za-z0-9_\-\.]+)\s+traceId=(?<traceId>[A-Za-z0-9]+)(?:\s+status=(?<status>\d+))?)$

[PARSER]
    Name   filename_tenant
    Format regex
    # 从来源文件名提取租户：default.log → default。这是"来源即归属"的本地模拟形态；
    # 云上 K8s 的等价实现是读 Pod 的 namespace/label，系统日志等价实现是主机 tag → CMDB。
    Regex  ^(?<tenant_id>[a-z][a-z0-9_]*)\.log$
