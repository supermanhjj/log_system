# =============================================================================
# 统一上报：采集器不直连 OpenSearch/ClickHouse，也不按租户维护多个 output
# （那会重新引入硬编码租户清单）。
#
# 由接入网关统一做：租户合法性校验、host→CMDB 归属判定、无法归属→logs-unknown、
# 分类校验、级别归一、敏感信息脱敏、按租户落索引。后续的数据采样/限流也在这一层。
# =============================================================================
[OUTPUT]
    Name                http
    Match               ruilog.*
    Host                ingest-service
    Port                8000
    URI                 /ingest/collector
    Format              json
    Header              Content-Type application/json
    Header              X-Collector-Key ${COLLECTOR_KEY}
    # 网关不可用时持续重试而不是丢数据；Retry_Limit False = 无限重试
    Retry_Limit         False
