# =============================================================================
# 系统日志（/var/log/syslog、messages、auth.log、kern.log）
#
# 生产主机上这些文件由 rsyslog/syslog-ng/journald 产出，格式是 RFC3164：
#   Nov 19 08:55:48 <host> authpriv.warn sshd: Failed password ...
# 本地用 sys-sim 容器内的 busybox syslogd 产出同构格式（真实守护进程落盘）。
#
# 租户归属：系统日志正文里没有任何业务信息，靠 host → hosts 台账（CMDB）判定，
# 由接入网关完成，采集端只负责把 host 带上来。
# =============================================================================
[INPUT]
    Name            tail
    Tag             ruilog.system.syslog
    # 注意：syslog 落盘文件名通常**没有 .log 后缀**（syslog / messages / auth.log 混用），
    # 这里用 * 全匹配，生产环境建议显式列出实际文件，避免把轮转中的 .gz 也撮进来
    Path            /var/log/ruilog/syslog
    Parser          syslog_busybox
    Path_Key        src_file
    Read_from_head  On
    DB              /fluent-bit/db/tail-system.db
    # 系统日志量远大于业务日志，缓冲按类型单独设定，避免挤占业务通道
    Buffer_Chunk_Size 256K
    Buffer_Max_Size   4M
    Mem_Buf_Limit     20M

# 字段归一：采集器解析出的 syslog_host / syslog_tag 映射到平台通用字段，
# 其余（facility / severity_name）原样保留，由网关做级别归一。
[FILTER]
    Name    modify
    Match   ruilog.system.syslog
    Rename  syslog_host host
    Rename  syslog_tag  source
    Add     log_class   system
    Add     source_type syslog
    Add     app         linux

# -----------------------------------------------------------------------------
# 生产环境补充（按需启用）：
#   ① journald：Fluent Bit 的 systemd 输入插件直接读 journal，无需解析文本
#       [INPUT]
#           Name            systemd
#           Tag             ruilog.system.journald
#           Path            /var/log/journal
#           DB              /fluent-bit/db/journal.db
#           Systemd_Filter  _SYSTEMD_UNIT=ssh.service
#   ② 网络设备 / 无 agent 主机：开 syslog 接收端口
#       [INPUT]
#           Name   syslog
#           Tag    ruilog.system.remote
#           Mode   unix_tcp
#           Port   5140
#           Parser syslog-rfc5424
# -----------------------------------------------------------------------------
