[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    Parsers_File /fluent-bit/config/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# ---- 管控心跳：distroless 版 fluent-bit 5.2.0 未编译 exec 输入插件（仅含 exec_wasi），
#      故无法以 sh 调起 scripts/control.sh。改用 fluent-bit 原生 dummy 输入 + http 输出，
#      等效实现“业务主机侧 Fluent Bit 定时上报 agent-service”的语义。如需复用完整版
#      管控脚本，可换用含 exec 插件的 fluent-bit 构建（scripts/control.sh 仍可保留）。 ----
[INPUT]
    Name         dummy
    Tag          agent.heartbeat
    Dummy        {"hostname":"fluentbit","version":"1.0.0","status":"online","ts":"2026-01-01T00:00:00Z"}
    Interval_Sec 30

[OUTPUT]
    Name         http
    Match        agent.heartbeat
    Host         agent-service
    Port         8000
    URI          /heartbeat
    Format       json
    Header       Content-Type application/json

# ---- 采集：tail 业务日志（开发期由 log-generator 持续写入 app_logs 共享卷） ----
[INPUT]
    Name         tail
    Tag          log.*
    Path         /var/log/app/*.log
    Parser       app_log
    Read_from_head On

# ---- 多租户索引隔离：opensearch 输出 Index 不支持运行时 record accessor（${tenant_id} 在
#      配置加载时被当环境变量展开为空，导致全部落到字面量 logs- 索引）；故用 rewrite_tag
#      把 tenant_id 注入 tag（tenant.<id>），再按 tag 路由到固定 Index 的三个 output。
#      新 tag 用 tenant.* 前缀，刻意避开 rewrite_tag 自身的 Match log.*，避免 emitter 循环。
#      租户集合固定为 default/acme/gp（开发期，见 generate.py TENANTS）。 ----
[FILTER]
    Name         rewrite_tag
    Match        log.*
    Rule         $tenant_id ^(default|acme|gp)$ tenant.$1 false
    Rule         $tenant_id .* tenant.default false

# ---- 输出到 OpenSearch（日志直达可检索；开发期安全插件已关闭，无需 auth） ----
[OUTPUT]
    Name         opensearch
    Match        tenant.default
    Host         opensearch
    Port         9200
    Index        logs-default
    Suppress_Type_Name On

[OUTPUT]
    Name         opensearch
    Match        tenant.acme
    Host         opensearch
    Port         9200
    Index        logs-acme
    Suppress_Type_Name On

[OUTPUT]
    Name         opensearch
    Match        tenant.gp
    Host         opensearch
    Port         9200
    Index        logs-gp
    Suppress_Type_Name On

# ---- 心跳结果回采（stdout，便于在容器日志中观察） ----
[OUTPUT]
    Name         stdout
    Match        agent.heartbeat
