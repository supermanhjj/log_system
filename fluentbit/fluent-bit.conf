[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    Parsers_File /fluent-bit/config/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# =============================================================================
# 采集配置按"日志类型"拆分成多个文件，新增一类日志只加一个文件，不改主配置。
#   05  采集器自监控（心跳）
#   20  系统日志（syslog / auth / kern / cron）—— **已停用**：系统日志源已迁到
#       K8s（i6000-sys → DaemonSet 采集），docker 侧再采会出现双来源、双租户分裂。
#       docker-compose 已删除 sys-sim 服务，恢复纯本地验证时再启回本行。
#   30  中间件日志（nginx / redis / kafka）
#   40  数据库日志（mysql / postgresql）
#   90  统一上报接入网关
#
# 业务日志（10-business）也已随采集对象上 K8s 而停用：docker 侧不再产生
# <tenant>.log 文件（旧租户 default/acme/gp 已废止），若启用会 tail 到空目录。
# 设计见 docs/log-ingestion-model.md
# =============================================================================
@INCLUDE conf.d/05-agent.conf
# @INCLUDE conf.d/10-business.conf
# @INCLUDE conf.d/20-system.conf
@INCLUDE conf.d/30-middleware.conf
@INCLUDE conf.d/40-database.conf
@INCLUDE conf.d/90-output.conf
