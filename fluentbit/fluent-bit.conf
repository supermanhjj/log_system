[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    Parsers_File /fluent-bit/config/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# ---- 管控心跳：distroless 版 fluent-bit 5.2.0 未编译 exec 输入插件（仅含 exec_wasi），
#      故无法以 sh 调起 scripts/control.sh。改用 fluent-bit 原生 dummy 输入 + http 输出，
#      等效实现“业务主机侧 Fluent Bit 定时上报 agent-service”的语义。如需复用完整版
#      管控脚本，可换用含 exec 插件的 fluent-bit 构建（scripts/control.sh 仍可保留）。 ----
[INPUT]
    Name         dummy
    Tag          agent.heartbeat
    Dummy        {"hostname":"fluentbit","version":"1.0.0","status":"online","ts":"2026-01-01T00:00:00Z"}
    Interval_Sec 30

[OUTPUT]
    Name         http
    Match        agent.heartbeat
    Host         agent-service
    Port         8000
    URI          /heartbeat
    Format       json
    Header       Content-Type application/json

# ---- 采集：tail 业务日志 ----
# Path_Key 把来源文件名写进记录（src_file），这是"来源元数据"的载体：
# 租户归属来自日志**从哪个通道进来**，而不是正文里写了什么。
[INPUT]
    Name         tail
    Tag          src.*
    Path         /var/log/app/*.log
    # 旧格式残留文件（正文带 tenant=、结构不同）不采集，避免解析失败产生空记录
    Exclude_Path /var/log/app/app.log
    Parser       app_log
    Path_Key     src_file
    Read_from_head On
    # 采集断点：容器重启后从上次位置续读，避免整文件重读造成重复入库（生产必须项）
    DB           /fluent-bit/db/tail.db
    # 大批量回填时避免单 chunk 溢出被丢弃：放大输入缓冲与块尺寸
    Buffer_Chunk_Size 1M
    Buffer_Max_Size 20M
    Mem_Buf_Limit 50M

# ---- 来源打标：default.log → tenant_id=default ----
# 这里不再维护任何租户清单：文件名即来源标识，新增租户只需多一个来源文件/通道，
# 无需改采集配置。云上 K8s 的等价做法是 kubernetes filter 读 namespace/label；
# 系统日志的等价做法是主机 tag → CMDB 查询归属。
[FILTER]
    Name          parser
    Match         src.*
    Key_Name      src_file
    Parser        filename_tenant
    Reserve_Data  On

# ---- 统一写入：交给 ingest-service 数据面 ----
# 采集器不再直连 OpenSearch，也不按租户维护多个 output（那会重新引入硬编码清单）。
# 由接入网关统一做：租户合法性校验、无法归属→logs-unknown、按租户落索引、
# 后续的数据脱敏/采样/限流也都在这一层扩展。
[OUTPUT]
    Name    http
    Match   src.*
    Host    ingest-service
    Port    8000
    URI     /ingest/collector
    Format  json
    Header  Content-Type application/json
    Header  X-Collector-Key ${COLLECTOR_KEY}

# ---- 心跳结果回采（stdout，便于在容器日志中观察） ----
[OUTPUT]
    Name         stdout
    Match        agent.heartbeat
